name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test (Bun ${{ matrix.bun-version }})
        runs-on: ubuntu-latest
        timeout-minutes: 10

        strategy:
            fail-fast: false
            matrix:
                bun-version: ['1.4.4']

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ matrix.bun-version }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Uncomment if the project has a tsconfig.json and TypeScript installed.
            # - name: Type check
            #   run: bunx tsc --noEmit

            - name: Run tests
              run: bun test
